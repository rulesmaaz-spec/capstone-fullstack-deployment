---
- name: Deploy a test Nginx Pod via Ansible
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Create Nginx Deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ansible-nginx
            namespace: default
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: ansible-nginx
            template:
              metadata:
                labels:
                  app: ansible-nginx
              spec:
                containers:
                  - name: nginx
                    image: nginx:alpine
                    ports:
                      - containerPort: 80

    - name: Expose the Deployment as a Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: ansible-nginx
            namespace: default
          spec:
            selector:
              app: ansible-nginx
            ports:
              - port: 80
                targetPort: 80
                nodePort: 30090
            type: NodePort

