# values.yaml

replicaCount: 2

image:
  repository: "908252070469.dkr.ecr.ap-south-1.amazonaws.com/capstone-app" # REPLACE with your ECR URL
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: "nginx"
  host: "capstone.local" # We will use a fake domain for testing

# Database Configuration
database:
  host: "capstone-db.c123456789.ap-south-1.rds.amazonaws.com" # REPLACE with your RDS endpoint (from Terraform output)
  name: "tasks"
  user: "postgres"
  password: "FakePassword123" # In production, this goes in a K8s Secret, not values.yaml!
